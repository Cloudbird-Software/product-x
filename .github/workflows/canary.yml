name: canary
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
    inputs:
      synthetic:
        description: "Run synthetic canary issue creation"
        required: false
        default: 'true'
permissions: {contents: read, issues: write, pull-requests: write}
jobs:
  # ============================================================
  # Job 1: 合成工单走完整链路（开卡→claim→commit→PR→done→关卡）
  # 任一环节断 → 下一步 if: failure() 开 Incident 并 @人类
  # ============================================================
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run canary chain
        env:
          # 用高权限 PAT：需 admin merge 绕过 product-x 的 code-owner 保护
          GH_TOKEN: ${{ secrets.LOOP_CANARY_TOKEN }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_PRODUCT: ${{ vars.LOOP_PRODUCT }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          chmod +x .loop/scripts/canary-chain.sh
          .loop/scripts/canary-chain.sh
      - name: Open Incident on chain break
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.LOOP_CANARY_TOKEN }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          MENTION="${LOOP_HUMAN:+@$LOOP_HUMAN }"
          gh label create "incident" -R "$LOOP_ORG/loop" --color b60205 2>/dev/null || true
          # 写 body 到文件，避免 YAML literal block 里多行字符串的缩进问题
          INC_BODY="$(mktemp)"
          {
            echo "${MENTION}Canary synthetic-ticket chain failed in run $GITHUB_RUN_ID."
            echo ""
            echo "The full chain (open card → claim → commit → PR → done → gate) did not complete. A 30-minute break threshold is enforced by the hourly cadence: if this run failed, the chain has been broken since the last successful run."
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Action: inspect the failed 'Run canary chain' step log; check conductor / loopd / product-x branch protection."
          } > "$INC_BODY"
          # 30 分钟阈值：本 hourly run 失败即视为链路断裂（cron 间隔 1h，断 >30min 由 survival 兜底）
          gh issue create -R "$LOOP_ORG/loop" \
            --title "Incident: canary chain broken @ $(date -u +%FT%TZ)" \
            --label "incident" \
            --body-file "$INC_BODY" || echo "WARN: failed to open Incident"

  # ============================================================
  # Job 2: 26 小时存活自检（audit/export/canary 任一超时 → Incident）
  # ============================================================
  survival:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: t
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with: {app-id: "${{ secrets.CONDUCTOR_APP_ID }}", private-key: "${{ secrets.CONDUCTOR_APP_KEY }}", owner: "${{ github.repository_owner }}"}
      - name: 26h survival self-check
        env:
          GH_TOKEN: ${{ steps.t.outputs.token }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_REPO: ${{ github.event.repository.name }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          chmod +x .loop/scripts/canary-survival.sh
          .loop/scripts/canary-survival.sh || true

  # === C-012 impl step 1: canary合成工单必须带 label=canary，避免混入真实工作流 ===
  # (tier=trivial, minimal change)
  canary-synthetic:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.synthetic == 'true' }}
    outputs:
      canary_synthetic_issue_number: ${{ steps.create.outputs.canary_synthetic_issue_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Create/update synthetic canary issue (label=canary)
        id: create
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          set -e
          existing=$(gh issue list -R ${{ github.repository }} --label canary --limit 1 --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            new_num=$(gh issue create -R ${{ github.repository }} --label canary --title "CANARY-SYNTHETIC" --body "Canary synthetic issue. Auto-generated by canary workflow. Do NOT move to in_progress." | grep -oP '[0-9]+$' || true)
            echo "canary_synthetic_issue_number=$new_num" >> $GITHUB_OUTPUT
          else
            echo "canary_synthetic_issue_number=$existing" >> $GITHUB_OUTPUT
          fi

  # === C-012 impl step 2: Canary stale alert (24h无更新→在GRIPE BOX留言) ===
  canary-alert:
    needs: [canary-synthetic]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check canary freshness and alert
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          set +e
          stale=$(gh issue list -R ${{ github.repository }} --label canary --json updatedAt             -q '.[] | select((now | fromdateiso8601) - (.updatedAt | fromdateiso8601) > 86400) | length')
          if [ "${stale:-0}" != "0" ]; then
            gh issue comment 1 -R ${{ github.repository }}               --body "[CANARY STALE ALERT] label=canary 的合成工单 >24h 无更新，loopd/conductor 可能断链。"
            exit 1
          fi
          echo "canary fresh"

