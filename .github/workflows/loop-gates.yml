name: loop-gates
# ============================================================
# product-x 门禁薄壳（R13-3）。
#
# 铁律（CHARTER N9）：
#   - 本文件只允许 `uses:` 引用 loop 侧 reusable workflow，零本地 run 步骤。
#     任何在薄壳里加 run/逻辑的改动 → CODEOWNERS 拦截 + gate/loop-conformance 红。
#   - SHA 用 40 位钉死，由 upgrade 环回填（禁止手填 main/latest，CHARTER N4）。
#   - 不使用 secrets: inherit（CHARTER N10）：secrets 显式传入。
#   - profile=strict：产品仓用 strict profile（required check 集合由 loop 侧
#     policy.yml 的 profile 映射决定，产品仓不得自行改名，CHARTER N9/G2）。
# ============================================================
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gates:
    uses: Cloudbird-Software/loop/.github/workflows/reusable-gates.yml@660f191c30fcf2f09044953af7ba5ae3a3a6e784
    with:
      profile: strict
      loop-sha: 660f191c30fcf2f09044953af7ba5ae3a3a6e784
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
