# deploy.yml — OIDC deployment workflow (R2)
#
# Design principles:
#   1. Zero long-term cloud secrets in the repository.
#   2. Cloud credentials obtained at runtime via GitHub OIDC.
#   3. Provider-agnostic skeleton + two concrete examples (AWS, GitHub Pages).
#
# This workflow uses `environment: production` which requires human approval
# (Required reviewers = you, per MANUAL W6 B25).
# prevent self-review is NOT enabled (per MANUAL).

name: deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target (aws, pages, dry-run)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - aws
          - pages
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # Required for OIDC token exchange

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare (OIDC check)
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy_target: ${{ steps.resolve.outputs.target }}
      artifact_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "target=${{ vars.DEPLOY_TARGET || 'dry-run' }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.deploy_target }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify OIDC token available
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "FAIL: OIDC token request URL not set. Ensure id-token: write permission."
            exit 1
          fi
          echo "OK: OIDC token endpoint available"
      - name: Build artifact
        id: build
        run: |
          echo "Building artifact..."
          mkdir -p dist
          echo "build-${{ github.sha }}" > dist/version.txt
          digest=$(sha256sum dist/* | sha256sum | cut -d' ' -f1)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Artifact digest: ${digest}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-artifact
          path: dist/

  deploy-aws:
    name: Deploy to AWS (OIDC)
    runs-on: ubuntu-latest
    environment: production
    needs: prepare
    if: needs.prepare.outputs.deploy_target == 'aws'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-artifact
          path: dist/
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy
        run: |
          echo "Deploying to AWS..."
          echo "Artifact version: $(cat dist/version.txt)"
          echo "Deploy complete (skeleton)"

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment: production
    needs: prepare
    if: needs.prepare.outputs.deploy_target == 'pages'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-artifact
          path: dist/
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  dry-run:
    name: Dry-run (no deployment)
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_target == 'dry-run'
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-artifact
          path: dist/
      - name: Verify artifact
        run: |
          echo "Dry-run: artifact built successfully"
          echo "Version: $(cat dist/version.txt)"
          echo "Digest: ${{ needs.prepare.outputs.artifact_digest }}"
          echo "No cloud resources were accessed."
