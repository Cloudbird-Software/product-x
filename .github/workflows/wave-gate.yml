# wave-gate.yml — 波次 PR 门禁 + !command 微指令处理（W4-2/W4-4）
# 触发：波次 PR（修改 waves/**）或 issue_comment（! 开头）
# 检查：speckit.analyze + speckit.checklist（best-effort）+ 路径租约交叉 + charter 映射
# 任一不过 → 标 blocked
name: wave-gate
on:
  pull_request:
    paths: ["waves/**"]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Python deps
        run: pip install PyYAML
      - name: speckit analyze
        id: speckit-analyze
      # fake-green-ok: wave gate 检查步骤单步失败不阻断整体，collect 步骤最后 exit 1
        continue-on-error: true
        run: |
        # fake-green-ok: specify-cli 可能已在 runner 上，pip install 失败属可接受 fallback
          pip install specify-cli 2>/dev/null || true
          specify analyze 2>&1 | tee speckit-analyze.txt || echo "speckit analyze not available (non-blocking)"
      - name: speckit checklist
        id: speckit-checklist
      # fake-green-ok: wave gate 检查步骤单步失败不阻断整体，collect 步骤最后 exit 1
        continue-on-error: true
        run: |
          specify checklist 2>&1 | tee speckit-checklist.txt || echo "speckit checklist not available (non-blocking)"
      - name: Core gate checks
        id: checks
        run: |
          python3 << 'PYEOF'
          import json, re, fnmatch, sys, pathlib, os
          VALID_TIERS = {"trivial", "standard", "critical"}
          cards = []
          waves_dir = pathlib.Path("waves")
          if waves_dir.exists():
              for f in sorted(waves_dir.glob("**/*.md")):
                  text = f.read_text()
                  for m in re.finditer(r'```json loop\n(.*?)```', text, re.DOTALL):
                      try:
                          card = json.loads(m.group(1).strip())
                          card["_source"] = str(f)
                          cards.append(card)
                      except json.JSONDecodeError as e:
                          print(f"BAD JSON in {f}: {e}")
          errors = []
          warnings = []
          if not cards:
              errors.append("No valid card definitions found in waves/")
          for i, a in enumerate(cards):
              for b in cards[i+1:]:
                  paths_a = a.get("paths", [])
                  paths_b = b.get("paths", [])
                  conflict = any(
                      fnmatch.fnmatch(x.rstrip("/*"), y.rstrip("/*")) or
                      fnmatch.fnmatch(y.rstrip("/*"), x.rstrip("/*"))
                      for x in paths_a for y in paths_b
                  )
                  if conflict:
                      errors.append(f"Path conflict: {a.get('id','?')} and {b.get('id','?')}")
          charter_path = pathlib.Path("CHARTER.md")
          charter_ids = None
          if charter_path.exists():
              ctext = charter_path.read_text()
              charter_ids = set()
              for m in re.finditer(r'^([GNUQ]\d+)\s', ctext, re.MULTILINE):
                  charter_ids.add(m.group(1))
          for card in cards:
              cid = card.get("id", "unnamed")
              charter = card.get("charter")
              if not charter:
                  errors.append(f"Card {cid}: missing charter mapping")
              elif charter_ids is None:
                  if charter != ["G0"]:
                      warnings.append(f"Card {cid}: charter should be ['G0'] (CHARTER.md missing)")
              else:
                  for ref in charter:
                      if ref not in charter_ids:
                          errors.append(f"Card {cid}: charter ref '{ref}' not found in CHARTER.md")
          for card in cards:
              cid = card.get("id", "unnamed")
              tier = card.get("tier", "standard")
              if tier not in VALID_TIERS:
                  errors.append(f"Card {cid}: invalid tier '{tier}'")
          for card in cards:
              cid = card.get("id", "unnamed")
              acc = card.get("acceptance", [])
              if not acc or len(acc) < 1:
                  errors.append(f"Card {cid}: acceptance must have >= 1 criterion")
          report = "## 机器自检 (Wave Gate)\n\n"
          report += f"**Cards found:** {len(cards)}\n\n"
          if errors:
              report += "### BLOCKED\n\n"
              for e in errors:
                  report += f"- {e}\n"
              report += "\n> PR is **blocked**. Fix the issues above before merging.\n"
          else:
              report += "### All blocking checks passed\n\n"
              report += "- Path cross-detection: no conflicts\n"
              report += "- Charter mapping: complete\n"
              report += "- Tier validity: all valid\n"
              report += "- Acceptance criteria: all cards have at least 1\n"
          if warnings:
              report += "\n### Warnings\n\n"
              for w in warnings:
                  report += f"- {w}\n"
          for label, fname in [("speckit.analyze", "speckit-analyze.txt"), ("speckit.checklist", "speckit-checklist.txt")]:
              try:
                  content = pathlib.Path(fname).read_text().strip()
                  if content and "not available" not in content:
                      report += f"\n### {label}\n```\n{content}\n```\n"
                  elif content:
                      report += f"\n### {label} (skipped)\n{content}\n"
              except Exception:
                  pass
          pathlib.Path("wave-gate-report.md").write_text(report)
          print(report)
          has_errors = "1" if errors else "0"
          out_file = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(out_file, "a") as f:
              f.write(f"result={has_errors}\n")
          if errors:
              sys.exit(1)
          PYEOF
      - name: Post gate report to PR
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1286971abc # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('wave-gate-report.md', 'utf8'); } catch(e) {
              report = '## 机器自检 (Wave Gate)\n\nGate check did not produce a report.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
      - name: Add blocked label on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1286971abc # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['blocked']
            });
      - name: Remove blocked label on success
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1286971abc # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'blocked'
              });
            } catch(e) { }

  commands:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '!')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/loop
          path: loop
          ref: main
      - name: Verify this is a wave PR
        id: verify
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1286971abc # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              if (!pr || pr.state !== 'open') {
                core.setOutput('skip', '1');
                return;
              }
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              const hasWave = files.some(f => f.filename.startsWith('waves/'));
              core.setOutput('skip', hasWave ? '0' : '1');
            } catch(e) {
              core.setOutput('skip', '1');
            }
      - name: Process !commands
        if: steps.verify.outputs.skip != '1'
        run: |
          pip install PyYAML
          python3 loop/conductor/commands.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_REPO: product-x
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
