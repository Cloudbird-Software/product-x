name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Python syntax check
        run: |
          errors=""
          while IFS= read -r -d '' f; do
            if ! python3 -c "compile(open('$f').read(), '$f', 'exec')" 2>/dev/null; then
              errors="$errors $f"
            fi
          done < <(find . -name "*.py" -not -path "./.git/*" -print0)
          if [ -n "$errors" ]; then
            echo "Syntax errors in:$errors"
            exit 1
          fi
          echo "All Python files pass syntax check"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install deps
        run: pip install flask pytest
      - name: Run pytest
        run: python3 -m pytest tests/ -v

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run verify.sh
        run: bash .loop/verify.sh

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check contracts exist
        run: |
          count=$(find contracts/ -name "*.md" 2>/dev/null | wc -l)
          if [ "$count" -ge 1 ]; then
            echo "Contracts found: $count"
          else
            echo "No contracts found"
            exit 1
          fi

  verdict-binding:
    name: verdict-binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: run gate_verdict
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # R10-2: 未执行等价于失败（CHARTER N8.3）。gate 解析顺序：.loop/gates -> gates -> ../gates。
          # 三处都找不到时打印 GATE_NOT_EXECUTED 并以非零退出，绝不再 SKIP(ec=0) 假绿。
          GATE=gate_verdict
          for d in .loop/gates gates ../gates; do
            if [ -f "$d/$GATE.py" ]; then
              python3 "$d/$GATE.py"
              exit $?
            fi
          done
          echo "GATE_NOT_EXECUTED: $GATE (searched .loop/gates, gates, ../gates — none found)"
          exit 1

  paths-lease:
    name: paths-lease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: run gate_paths
        env:
          GITHUB_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # R10-2: 未执行等价于失败（CHARTER N8.3）。gate 解析顺序：.loop/gates -> gates -> ../gates。
          # 三处都找不到时打印 GATE_NOT_EXECUTED 并以非零退出，绝不再 SKIP(ec=0) 假绿。
          GATE=gate_paths
          for d in .loop/gates gates ../gates; do
            if [ -f "$d/$GATE.py" ]; then
              python3 "$d/$GATE.py"
              exit $?
            fi
          done
          echo "GATE_NOT_EXECUTED: $GATE (searched .loop/gates, gates, ../gates — none found)"
          exit 1
